name: automove_driver
description: "Carpital Consult Driver — Vehicle Transport Driver Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & navigation
  provider: ^6.1.2
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.2.0

  # Maps (Google Maps — key in android/local.properties and ios/Flutter/Secrets.xcconfig)
  google_maps_flutter: ^2.18.1

  # Storage & Backend
  shared_preferences: ^2.3.3
  supabase_flutter: ^2.8.3
  http: ^1.2.2

  # Utilities
  intl: ^0.19.0

  # Camera / media
  image_picker: ^1.1.2

  # OTP input
  pinput: ^3.0.1

  # Timeline
  timeline_tile: ^2.0.0
  geolocator: ^14.0.3
  record: ^7.1.1
  path_provider: ^2.1.6
  flutter_dotenv: ^6.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
